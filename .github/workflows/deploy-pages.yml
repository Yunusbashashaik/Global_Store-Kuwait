name: Deploy to GitHub Pages

# https://yunusbashashaik.github.io/Global_Store-Kuwait/
# Pages setting: Deploy from a branch → gh-pages → / (root)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build client
        run: npm run build -w client
        env:
          VITE_BASE_PATH: /Global_Store-Kuwait/

      - name: SPA fallback + Jekyll bypass
        run: |
          cp client/dist/index.html client/dist/404.html
          touch client/dist/.nojekyll

      - name: Publish to gh-pages branch (root only)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/dist
          publish_branch: gh-pages
          force_orphan: true
