name: Deploy Pages from main

# Builds the storefront from main. No gh-pages branch.
# Settings → Pages → Source: GitHub Actions
# Site: https://yunusbashashaik.github.io/Global_Store-Kuwait/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-actions
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build client
        run: npm run build -w client
        env:
          VITE_BASE_PATH: /Global_Store-Kuwait/
      - name: SPA fallback + Jekyll bypass
        run: |
          cp client/dist/index.html client/dist/404.html
          touch client/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
